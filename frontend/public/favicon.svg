<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="i2i-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="i2i-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="i2i-grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <filter id="i2i-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base Shield / Hexagon Plate -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#0c1421" stroke="#26364a" stroke-width="1.5"/>
  <rect x="4" y="4" width="40" height="40" rx="8" fill="#141c29" fill-opacity="0.6"/>

  <!-- Inbound Stream Lines (Input Information) -->
  <path d="M10 16H18M10 24H15M10 32H18" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

  <!-- Central Prism Core (Single Canonical Synthesis Node) -->
  <g filter="url(#i2i-shadow)">
    <polygon points="24,10 32,24 24,38 16,24" fill="url(#i2i-grad-primary)" stroke="#60A5FA" stroke-width="1.5"/>
    <!-- Inner Core -->
    <polygon points="24,17 28,24 24,31 20,24" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>

  <!-- Outbound Transformation Rays (Multi-Artefact Impact) -->
  <path d="M28 17L38 13" stroke="url(#i2i-grad-primary)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32 24H40" stroke="url(#i2i-grad-accent)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M28 31L38 35" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Target Impact Spark Points -->
  <circle cx="38" cy="13" r="2" fill="#60A5FA"/>
  <circle cx="40" cy="24" r="2.2" fill="#34D399"/>
  <circle cx="38" cy="35" r="2" fill="#38BDF8"/>
</svg>